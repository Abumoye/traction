name: Build site from source and publish

# Rebuilds the static site from source/ (Jinja2 templates + JSON content)
# whenever source/ changes on main, and commits the built output back into
# the repo root — which is what GitHub Pages actually serves. This keeps
# Pages configuration untouched (still "deploy from branch: main / root");
# editing a JSON file under source/content/ and pushing to main is enough
# to update the live site, no local build step required.
on:
  push:
    branches: [main]
    paths:
      - "source/**"
  workflow_dispatch: {}
  # Rebuild every night just after midnight (Nigeria time) so a job whose
  # closing date has passed is taken off the site, the feeds and Google
  # without anyone pushing a change.
  schedule:
    - cron: "10 23 * * *"

permissions:
  contents: write
  id-token: write   # lets the job prove its identity to Google (keyless, for the Indexing API)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install jinja2 beautifulsoup4 lxml

      - name: Build site
        working-directory: source
        run: python3 build.py

      - name: Publish build output to repo root
        run: |
          set -e
          # Only publish folders the build actually produced, so removing a
          # section from the site never breaks the publish step.
          SITE_DIRS="apply articles book-a-call resources brands books css downloads events founder images js partnerships privacy-policy services"
          for d in $SITE_DIRS; do
            if [ -d "source/dist/$d" ]; then
              rm -rf "$d"
              cp -r "source/dist/$d" "$d"
            fi
          done
          for f in index.html search-index.json jobs.json jobs.xml; do
            if [ -f "source/dist/$f" ]; then
              cp "source/dist/$f" "$f"
            fi
          done
          rm -rf source/dist

      - name: Commit and push if changed
        run: |
          git config user.name "traction-site-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in apply articles book-a-call resources brands books css downloads events founder images js partnerships privacy-policy services index.html search-index.json jobs.json jobs.xml; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto-build: publish site from source/ [skip ci]"
            git push
          fi

      # Tell Google about new, changed and closed jobs (Indexing API). Does
      # nothing until Google is set up; a failure here never blocks the site
      # from publishing. See docs/google-indexing-api-setup.md.
      #
      # Keyless sign-in (recommended): needs the two repository VARIABLES
      # GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT.
      # Key sign-in (alternative): the repository SECRET GOOGLE_INDEXING_SA_JSON.
      - name: Sign in to Google (keyless)
        id: google-auth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/indexing
          create_credentials_file: false

      - name: Notify Google Indexing API
        continue-on-error: true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          pip install google-auth requests
          python3 scripts/notify_google_indexing.py --wait-live

      - name: Save indexing state
        if: always()
        run: |
          git config user.name "traction-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add source/indexing-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Indexing state unchanged."
          else
            git commit -m "Auto-build: update Google indexing state [skip ci]"
            git push
          fi
